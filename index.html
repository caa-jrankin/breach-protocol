/* ---------- duplicate team names (start screen) ---------- */
let dupConfirmedFor = '';   // name key a team has confirmed is really theirs

function findNameInUse(name){
  const k = nameKey(name);
  if(!k) return null;
  const local = leaderboard.find(e => nameKey(e.name) === k);
  if(local) return local;
  if(publishedNameKeys.has(k)) return { name, published:true };
  return null;
}
function nameInUseText(name){
  const hit = findNameInUse(name);
  if(!hit) return '';
  const where = hit.published ? 'on the event leaderboard' : `on the leaderboard${hit.label ? ` (laptop ${hit.label})` : ''}`;
  return `${name.trim().toUpperCase()} is already ${where}. If that's your team playing again, carry on. Otherwise, please pick a different name.`;
}
function showNameWarning(){
  const input = document.getElementById('nameInput');
  const warn = document.getElementById('nameWarn');
  if(!input || !warn) return;
  warn.textContent = nameInUseText(input.value);
}
// Pull names from the published event leaderboard (if online) so clashes with other laptops are caught too.
function loadPublishedNames(){
  if(Date.now() - publishedNamesFetchedAt < 60000) return;
  publishedNamesFetchedAt = Date.now();
  fetchPublishedLeaderboard(true).then(r=>{   // quiet: offline is normal for downloaded copies
    if(r.status !== 'ok') return;
    publishedNameKeys = new Set(r.entries.map(e => nameKey(e.name)));
    if(state.screen === 'brief') showNameWarning();
  });
}
function confirmDuplicateName(name){
  openDialog(`
    <h3>That name is already taken</h3>
    <p class="dialog-text">${escapeHtml(nameInUseText(name))}</p>
    <div class="dialog-actions">
      <button class="btn" id="dupChange">Choose another name</button>
      <button class="btn ghost" id="dupSame">We're the same team, start</button>
    </div>`);
  document.getElementById('dupChange').onclick = ()=>{
    closeDialog();
    const input = document.getElementById('nameInput');
    if(input){ input.focus(); input.select(); }
  };
  document.getElementById('dupSame').onclick = ()=>{
    closeDialog();
    dupConfirmedFor = nameKey(name);
    beginMission(name);
  };
  document.getElementById('dupChange').focus({ preventScroll:true });
}

function beginMission(name){
    state.playerName = name;
    dupConfirmedFor = '';
    const n = activeStages().length;
    state.answers = Array(n).fill('');
    state.hintsShown = Array(n).fill(0);
    state.given = Array(n).fill(false);
    state.incomplete = false;
    state.screen = 0;
    startTimer();
    render();
}

/* ============ RENDER: STAGE ============ */
function hintButtonLabel(idx, s){
  const used = state.hintsShown[idx];
  const total = stageHintCount(s);
  if(used >= total) return `All hints used (${used}/${total})`;
  return `Get a hint: −${SCORING.perHint} pts (${used}/${total} used)`;
}
function hintAreaHtml(idx, s){
  if(!state.hintsShown[idx]) return '';
  return stageHints(idx).slice(0, state.hintsShown[idx]).map((h,i)=>`Hint ${i+1}: ${h}`).join('<br>');
}

function renderStage(idx){
  const list = activeStages();
  const s = list[idx];
  const panel = document.getElementById('panel');

  let toolHtml = '';
  if(s.tool==='caesarSlider'){
    const showPreview = s.preview !== false;
    toolHtml = `
      <div class="shift-tool">
        <label for="shiftRange">${showPreview ? 'Shift back by' : 'Test a shift'}: <span id="shiftVal">0</span></label>
        <input type="range" min="0" max="25" value="0" id="shiftRange">
        ${showPreview
          ? `<div class="shift-preview" id="shiftPreview">${s.cipher}</div>`
          : `<div class="wheel-wrap" id="shiftWheel">${caesarWheelHtml(0)}</div>`}
      </div>`;
  } else if(s.tool==='morsePlayer'){
    const chips = Object.keys(MORSE).map(l => `<span class="morse-chip"><b>${l}</b> ${MORSE[l]}</span>`).join('');
    toolHtml = `
      <div class="morse-flash-wrap">
        <div class="morse-light" id="morseLight"></div>
        <button class="play-btn" id="playMorse">▶ Play Signal</button>
      </div>
      ${s.inlineChart === false ? '' : `
      <div class="morse-ref">
        <div class="morse-ref-title">Morse Reference — A to Z</div>
        <div class="morse-grid">${chips}</div>
      </div>`}`;
  } else if(s.tool==='recap'){
    const rows = list.slice(0,-1).map((st,i) =>
      `<div class="recap-row"><span>${i+1}. ${st.name}</span><span>${state.answers[i] || '—'}</span></div>`).join('');
    toolHtml = `<div class="recap">${rows}</div>`;
  }
  const kitKind = toolkitKind(s);
  if(kitKind){
    toolHtml += `<div class="tool-row"><button class="btn ghost" id="openToolkit">${TOOLKIT_LABELS[kitKind]}</button></div>`;
  }

  const cipherBlock = s.cipher ? `
    <div class="cipher-box">
      <div class="cipher-text">${s.cipher}</div>
      ${stageKeyword(s, idx) ? `<div class="cipher-sub">${s.keywordLabel || 'Keyword'}: ${stageKeyword(s, idx)}</div>` : ''}
    </div>` : '';

  const outOfHints = state.hintsShown[idx] >= stageHintCount(s);
  panel.innerHTML = `
    <p class="stage-eyebrow">Stage ${idx+1} / ${list.length} — ${s.category} <span style="color:var(--text-dim); text-transform:none; letter-spacing:0;">· ${s.difficulty}</span></p>
    <h2 class="stage-title">${stageText(s.title, idx)}</h2>
    <p class="briefing">${stageText(s.briefing, idx)}</p>
    <div class="explainer">${stageText(s.explainer, idx)}</div>
    ${cipherBlock}
    ${toolHtml}
    <div class="answer-row">
      <input type="text" id="answerInput" placeholder="Type the decoded word..." autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your answer">
      <button class="btn" id="submitBtn">Decrypt</button>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="aux-row">
      <button class="btn ghost" id="hintBtn" ${outOfHints?'disabled':''}>${hintButtonLabel(idx, s)}</button>
      ${idx>0 ? `<button class="btn ghost" id="backBtn">← Previous</button>` : '<span></span>'}
    </div>
    <div class="hint-area" id="hintArea">${hintAreaHtml(idx, s)}</div>
  `;

  if(state.answers[idx]) document.getElementById('answerInput').value = state.answers[idx];

  // inline tool wiring
  if(s.tool==='caesarSlider'){
    const range = document.getElementById('shiftRange');
    const val = document.getElementById('shiftVal');
    range.oninput = ()=>{
      const shift = parseInt(range.value, 10);
      val.textContent = shift;
      if(s.preview !== false) document.getElementById('shiftPreview').textContent = caesarShift(s.cipher, shift);
      else document.getElementById('shiftWheel').innerHTML = caesarWheelHtml(shift);
    };
  }
  if(s.tool==='morsePlayer'){
    document.getElementById('playMorse').onclick = (e)=>{ playMorseSignal(s.cipher, e.currentTarget, s.morseUnit); focusAnswer(); };
  }
  // toolkit wiring uses the same toolkitKind() as the render step above
  if(kitKind){
    document.getElementById('openToolkit').onclick = ()=> openToolkit(kitKind, stageKeyword(s, idx), toolkitExtra(s));
  }

  document.getElementById('submitBtn').onclick = ()=> checkAnswer(idx);
  document.getElementById('answerInput').addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(idx); });
  document.getElementById('hintBtn').onclick = ()=> showHint(idx);
  if(idx>0) document.getElementById('backBtn').onclick = ()=>{ state.screen = idx-1; render(); };
  focusAnswer();
}

/* ============ AUDIO (Morse) ============ */
let audioCtx = null;
function ensureAudioCtx(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ console.error('Audio unavailable', e); }
  return audioCtx;
}
function beep(ctx, startTime, durationSec){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 660;
  osc.connect(gain);
  gain.connect(ctx.destination);
  const rampUp = Math.min(0.008, durationSec/3);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(0.22, startTime+rampUp);
  gain.gain.setValueAtTime(0.22, Math.max(startTime+rampUp, startTime+durationSec-rampUp));
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime+durationSec);
  osc.start(startTime);
  osc.stop(startTime+durationSec+0.02);
}
function playMorseSignal(morseStr, btn, unitMs){
  btn.disabled = true;
  const light = document.getElementById('morseLight');
  const ctx = ensureAudioCtx();
  const unit = unitMs || 160;
  let seq = [];
  morseStr.split('').forEach(ch=>{
    if(ch==='.') seq.push({on:unit, off:unit});
    else if(ch==='-') seq.push({on:unit*3, off:unit});
    else if(ch===' ') seq.push({on:0, off:unit*2});
  });
  let t = 0;
  const audioStart = ctx ? ctx.currentTime + 0.08 : null;
  seq.forEach(step=>{
    if(step.on>0){
      setTimeout(()=> light && light.classList.add('on'), t);
      setTimeout(()=> light && light.classList.remove('on'), t+step.on);
      if(ctx) beep(ctx, audioStart + t/1000, step.on/1000);
    }
    t += step.on + step.off;
  });
  setTimeout(()=>{ btn.disabled = false; }, t+150);
}

/* ============ HINTS + ANSWERS ============ */
/* Put the cursor in the answer box so players can type straight away.
   Only on laptops/desktops (mouse or trackpad): on phones and tablets it would pop up the keyboard
   and cover the cipher. preventScroll keeps the page where it is so the briefing stays in view. */
function canAutoFocus(){
  return !window.matchMedia || window.matchMedia('(hover: hover) and (pointer: fine)').matches;
}
function focusAnswer(selectAll){
  if(typeof state.screen !== 'number' || !canAutoFocus()) return;
  if(document.getElementById('modalBackdrop').classList.contains('show')) return;
  const input = document.getElementById('answerInput');
  if(!input) return;
  try{ input.focus({ preventScroll:true }); }catch(e){ input.focus(); }
  if(selectAll) input.select();
  else { const end = input.value.length; input.setSelectionRange(end, end); }
}

function showHint(idx){
  const s = activeStages()[idx];
  if(state.hintsShown[idx] >= stageHintCount(s)) return;
  state.hintsShown[idx]++;
  document.getElementById('hintArea').innerHTML = hintAreaHtml(idx, s);
  const btn = document.getElementById('hintBtn');
  btn.textContent = hintButtonLabel(idx, s);
  btn.disabled = state.hintsShown[idx] >= stageHintCount(s);
  updateHud();
  saveRun();
  focusAnswer();
}

function checkAnswer(idx){
  const list = activeStages();
  const s = list[idx];
  const input = document.getElementById('answerInput');
  const feedback = document.getElementById('feedback');
  const guess = input.value.trim().toUpperCase();
  if(answerOk(state.level, idx, guess)){
    state.answers[idx] = guess;
    feedback.className = 'feedback ok';
    feedback.textContent = '✓ Correct — system trace advancing...';
    document.getElementById('submitBtn').disabled = true;
    renderTrace();
    saveRun();
    setTimeout(()=>{
      if(state.screen !== idx) return;           // player navigated away during the delay
      if(idx === list.length-1) finishMission();
      else { state.screen = idx+1; render(); }
    }, 700);
  } else {
    feedback.className = 'feedback err';
    feedback.textContent = guess ? '✗ Not quite. Check the technique explanation and try again.' : 'Type your answer first.';
    focusAnswer(true);
  }
}

function finishMission(endedEarly = false){
  clearInterval(state.timerHandle);
  state.timerHandle = null;
  state.endTime = Date.now();
  state.incomplete = !!endedEarly;
  updateHud();
  state.screen = 'done';
  render();
  if(!endedEarly) launchConfetti();
}

/* ============ LEADERBOARD (saved on this device when the browser allows it) ============ */
// Saved with localStorage so scores survive a refresh or closing the tab when the file is opened
// in a normal browser. Sandboxes that block storage (e.g. the Claude app preview) fall back to
// memory only. Do NOT use window.storage: it failed in the Claude mobile app.
const LB_KEY = 'breachProtocol.leaderboard.v1';
const CLEARED_KEY = 'breachProtocol.clearedIds.v1';   // IDs wiped by Clear, so old codes can't bring them back
const DEVICE_KEY = 'breachProtocol.deviceId.v1';
const lbStore = (function(){
  try{
    const ls = window.localStorage;
    const probe = '__bp_probe__';
    ls.setItem(probe, '1');
    ls.removeItem(probe);
    return ls;
  }catch(e){ return null; }
})();

// Random ID for this device, so every score has a unique ID across all devices (used to skip duplicates on import).
const DEVICE_ID = (function(){
  const make = ()=>{
    let s = '';
    try{ crypto.getRandomValues(new Uint8Array(6)).forEach(b=>{ s += (b % 36).toString(36); }); }
    catch(e){ s = Math.random().toString(36).slice(2,8); }
    return s.padEnd(6,'0');
  };
  if(!lbStore) return make();
  try{
    let id = lbStore.getItem(DEVICE_KEY);
    if(!/^[a-z0-9]{6}$/.test(id || '')){ id = make(); lbStore.setItem(DEVICE_KEY, id); }
    return id;
  }catch(e){ return make(); }
})();
function makeEntryId(ts){ return DEVICE_ID + '-' + ts.toString(36); }

// Laptop label (e.g. "L3"), set by a facilitator. Shown next to every score this laptop records.
const LABEL_KEY = 'breachProtocol.deviceLabel.v1';
let deviceLabelMemory = '';
function cleanLabel(v){ return String(v || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0,6); }
function getDeviceLabel(){
  if(lbStore){ try{ return cleanLabel(lbStore.getItem(LABEL_KEY) || ''); }catch(e){} }
  return deviceLabelMemory;
}
function setDeviceLabel(v){
  const label = cleanLabel(v);
  deviceLabelMemory = label;
  if(lbStore){ try{ label ? lbStore.setItem(LABEL_KEY, label) : lbStore.removeItem(LABEL_KEY); }catch(e){} }
  return label;
}

// Duplicate team names: compared ignoring case, spaces and punctuation ("Night Owls" = "NIGHT-OWLS").
function nameKey(n){ return String(n || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
let publishedNameKeys = new Set();
let publishedNamesFetchedAt = 0;

function isValidEntry(e){
  return !!e && typeof e.id==='string' && typeof e.name==='string' && !!LEVELS[e.level] &&
    Number.isFinite(e.timeMs) && Number.isFinite(e.total) && Number.isFinite(e.ts);
}
function sortLeaderboard(list){
  // finished runs always rank above incomplete ones; then by score, then by time
  return list.sort((a,b)=> (a.incomplete?1:0)-(b.incomplete?1:0) || b.total-a.total || a.timeMs-b.timeMs);
}
function readSavedLeaderboard(){
  if(!lbStore) return null;
  try{
    const parsed = JSON.parse(lbStore.getItem(LB_KEY) || '[]');
    if(!Array.isArray(parsed)) return [];
    let migrated = false;
    parsed.forEach(e=>{   // scores saved before IDs existed get one now
      if(e && !e.id && Number.isFinite(e.ts)){ e.id = makeEntryId(e.ts); migrated = true; }
    });
    const list = sortLeaderboard(parsed.filter(isValidEntry));
    if(migrated){ try{ lbStore.setItem(LB_KEY, JSON.stringify(list)); }catch(e){} }
    return list;
  }catch(e){ console.error('Saved leaderboard unreadable', e); return []; }
}
function writeSavedLeaderboard(){
  if(!lbStore) return false;
  try{ lbStore.setItem(LB_KEY, JSON.stringify(leaderboard)); return true; }
  catch(e){ console.error('Could not save leaderboard', e); return false; }
}
function syncFromSaved(){ const saved = readSavedLeaderboard(); if(saved) leaderboard = saved; }

let leaderboard = readSavedLeaderboard() || [];
let clearedIdsMemory = [];

function readClearedIds(){
  if(!lbStore) return new Set(clearedIdsMemory);
  try{ const a = JSON.parse(lbStore.getItem(CLEARED_KEY) || '[]'); return new Set(Array.isArray(a) ? a : []); }
  catch(e){ return new Set(); }
}

function submitScore(entry){
  syncFromSaved();   // pick up scores saved from another tab of this file
  leaderboard.push(entry);
  sortLeaderboard(leaderboard);
  writeSavedLeaderboard();
  return entry;
}
function clearLeaderboard(){
  const cleared = readClearedIds();
  leaderboard.forEach(e => cleared.add(e.id));
  clearedIdsMemory = [...cleared];
  leaderboard = [];
  if(lbStore){
    try{
      lbStore.removeItem(LB_KEY);
      lbStore.setItem(CLEARED_KEY, JSON.stringify(clearedIdsMemory));
    }catch(e){ console.error('Could not clear saved leaderboard', e); }
  }
}
function leaderboardNote(){
  return lbStore
    ? 'One board for all levels, ranked by total score. Scores are saved on this device, so they stay after a refresh or closing the tab.'
    : 'One board for all levels, ranked by total score. This browser is blocking saved data (the Claude app preview does this), so scores clear on refresh. Open the downloaded file in Chrome, Edge or Safari to keep them.';
}

/* ============ LEADERBOARD CODES (copy a device's whole board to a master device) ============ */
// Format: BP1z.<base64url of deflate-raw JSON>.<checksum>   (BP1j = uncompressed fallback)
// JSON: { v:1, d:deviceId, e:[[id, name, level, timeMs, hints, ts], ...] }
// Totals are NOT in the code: the importing device recalculates them from time, hints and level.
const CODE_SALT = 'breach-protocol/cyber-switchup';

function codeChecksum(str){
  let h = 0x811c9dc5;   // FNV-1a, 32-bit
  const s = CODE_SALT + '|' + str;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}
function bytesToB64url(bytes){
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlToBytes(s){
  const b64 = s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function streamBytes(bytes, transform){
  const stream = new Blob([bytes]).stream().pipeThrough(transform);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function exportLeaderboardCode(){
  const json = JSON.stringify({ v:1, d:DEVICE_ID, e: leaderboard.map(entryToRow) });
  const raw = new TextEncoder().encode(json);
  let packed = null;
  if(typeof CompressionStream !== 'undefined'){
    try{ packed = await streamBytes(raw, new CompressionStream('deflate-raw')); }catch(e){ packed = null; }
  }
  return `BP1${packed ? 'z' : 'j'}.${bytesToB64url(packed || raw)}.${codeChecksum(json)}`;
}

function codeError(kind){ const e = new Error(kind); e.kind = kind; return e; }

async function decodeLeaderboardCode(code){
  const clean = String(code || '').replace(/\s+/g, '');
  const m = /^BP1([zj])\.([A-Za-z0-9_-]+)\.([a-z0-9]{1,8})$/.exec(clean);
  if(!m) throw codeError('format');
  let json;
  try{
    let bytes = b64urlToBytes(m[2]);
    if(m[1] === 'z'){
      if(typeof DecompressionStream === 'undefined') throw codeError('unsupported');
      bytes = await streamBytes(bytes, new DecompressionStream('deflate-raw'));
    }
    json = new TextDecoder('utf-8', { fatal:true }).decode(bytes);
  }catch(e){ throw e.kind ? e : codeError('damaged'); }
  if(codeChecksum(json) !== m[3]) throw codeError('damaged');
  let payload;
  try{ payload = JSON.parse(json); }catch(e){ throw codeError('damaged'); }
  if(!payload || payload.v !== 1 || !Array.isArray(payload.e)) throw codeError('format');
  return payload;
}

function maxHintsFor(level){ return LEVELS[level].stages.reduce((n,s)=> n + stageHintCount(s), 0); }

// Row format: [id, name, level, timeMs, hints, ts] plus an optional 7th item, the laptop label.
function entryToRow(e){
  const row = [e.id, e.name, e.level, e.timeMs, e.hints, e.ts];
  const extra = {};
  if(e.given) extra.g = e.given;
  if(e.incomplete) extra.s = e.solved;
  if(Object.keys(extra).length) row.push(e.label || '', extra);   // 8 items: label (may be empty) + extras
  else if(e.label) row.push(e.label);
  return row;
}

// Turn one imported row into a leaderboard entry, or null if anything about it doesn't add up.
function entryFromCode(row){
  if(!Array.isArray(row) || row.length < 6 || row.length > 8) return null;
  const [id, name, level, timeMs, hints, ts, label, extra] = row;
  if(row.length >= 7){
    if(typeof label !== 'string' || cleanLabel(label) !== label) return null;
    if(row.length === 7 && !label) return null;
  }
  if(!LEVELS[level]) return null;
  const n = LEVELS[level].stages.length;
  let given = 0, incomplete = false, solved = 0;
  if(row.length === 8){
    if(!extra || typeof extra !== 'object' || Array.isArray(extra)) return null;
    const keys = Object.keys(extra);
    if(!keys.length || keys.some(k => k !== 'g' && k !== 's')) return null;
    if('g' in extra){ if(!Number.isInteger(extra.g) || extra.g < 1 || extra.g > n) return null; given = extra.g; }
    if('s' in extra){ if(!Number.isInteger(extra.s) || extra.s < 0 || extra.s >= n) return null; incomplete = true; solved = extra.s; }
    if(incomplete && given > solved) return null;
  }
  if(typeof id !== 'string' || !/^[a-z0-9]{6}-[a-z0-9]{1,12}$/.test(id)) return null;
  if(typeof name !== 'string') return null;
  const cleanName = name.trim().toUpperCase().slice(0,24);
  if(!cleanName) return null;
  if(!LEVELS[level]) return null;
  if(!Number.isInteger(timeMs) || timeMs < 0 || timeMs > 24*3600*1000) return null;
  if(!Number.isInteger(hints) || hints < 0 || hints > maxHintsFor(level)) return null;
  if(!Number.isInteger(ts) || ts <= 0) return null;
  const entry = { id, name:cleanName, level, timeMs, hints, ts };
  if(label) entry.label = label;
  if(given) entry.given = given;
  if(incomplete){ entry.incomplete = true; entry.solved = solved; }
  entry.total = entryTotal(entry);   // recalculated, never trusted
  return entry;
}

// Merge rows ([id, name, level, timeMs, hints, ts]) into this device's board. Used by codes and the published file.
function mergeRows(rows){
  syncFromSaved();
  const have = new Set(leaderboard.map(e=>e.id));
  const cleared = readClearedIds();
  const result = { added:0, skipped:0, cleared:0, rejected:0, fromThisDevice:false };
  for(const row of rows){
    const entry = entryFromCode(row);
    if(!entry){ result.rejected++; continue; }
    if(have.has(entry.id)){ result.skipped++; continue; }
    if(cleared.has(entry.id)){ result.cleared++; continue; }
    have.add(entry.id);
    leaderboard.push(entry);
    result.added++;
  }
  sortLeaderboard(leaderboard);
  writeSavedLeaderboard();
  return result;
}

async function importLeaderboardCode(code){
  const payload = await decodeLeaderboardCode(code);
  const result = mergeRows(payload.e);
  result.fromThisDevice = payload.d === DEVICE_ID;
  return result;
}

/* ============ PUBLISHED EVENT LEADERBOARD (leaderboard.json in the GitHub repository) ============ */
// The facilitator downloads leaderboard.json from the master device and uploads it to the repository.
// Every copy of the game that's online can then read it. Nothing is ever written to GitHub from the page.
const PUBLISHED_FILE = 'leaderboard.json';
const PUBLISHED_FALLBACK_URL = 'https://caa-jrankin.github.io/breach-protocol/leaderboard.json';   // for downloaded copies
const PUBLISHED_FORMAT = 'breach-protocol-leaderboard';

function publishedUrl(){ return /^https?:$/.test(location.protocol) ? PUBLISHED_FILE : PUBLISHED_FALLBACK_URL; }

function buildPublishedFile(){
  const head = { format:PUBLISHED_FORMAT, v:1, updated:new Date().toISOString(), count:leaderboard.length };
  const rows = leaderboard.map(e => '    ' + JSON.stringify(entryToRow(e)));
  return '{\n' +
    Object.entries(head).map(([k,v]) => `  ${JSON.stringify(k)}: ${JSON.stringify(v)},`).join('\n') +
    '\n  "entries": [\n' + rows.join(',\n') + (rows.length ? '\n' : '') + '  ]\n}\n';
}

async function fetchPublishedLeaderboard(quiet = false){
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=> ctrl.abort(), 8000) : null;
  try{
    const res = await fetch(publishedUrl() + '?t=' + Date.now(), { cache:'no-store', signal: ctrl ? ctrl.signal : undefined });
    if(res.status === 404) return { status:'none' };
    if(!res.ok) throw new Error('HTTP ' + res.status);
    let data;
    try{ data = await res.json(); }catch(e){ return { status:'invalid' }; }
    if(!data || data.format !== PUBLISHED_FORMAT || data.v !== 1 || !Array.isArray(data.entries)) return { status:'invalid' };
    const seen = new Set();
    const entries = [];
    let rejected = 0;
    for(const row of data.entries){
      const e = entryFromCode(row);   // same checks as codes; totals recalculated
      if(!e){ rejected++; continue; }
      if(seen.has(e.id)) continue;
      seen.add(e.id);
      entries.push(e);
    }
    sortLeaderboard(entries);
    return { status:'ok', entries, rows:data.entries, rejected, updated: typeof data.updated === 'string' ? data.updated : null };
  }catch(e){
    if(!quiet) console.error('Could not load the published leaderboard', e);
    return { status:'error' };
  }finally{
    if(timer) clearTimeout(timer);
  }
}

function fmtUpdated(iso){
  const d = iso ? new Date(iso) : null;
  if(!d || isNaN(d)) return 'at an unknown time';
  try{ return d.toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return d.toISOString().slice(0,16).replace('T',' '); }
}

function downloadPublishedFile(){
  syncFromSaved();
  const blob = new Blob([buildPublishedFile()], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = PUBLISHED_FILE;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
  return leaderboard.length;
}

const CODE_ERROR_TEXT = {
  format:"That doesn't look like a Breach Protocol leaderboard code. Make sure you copied all of it, from BP1 to the end.",
  damaged:"This code is incomplete or has been changed. Copy it again from the other device and paste the whole thing.",
  unsupported:"This browser is too old to read leaderboard codes. Use an up-to-date Chrome, Edge or Safari for the master leaderboard."
};

// Export box shown under the leaderboard (end screen and start-screen viewer).
function renderExportBox(containerId){
  const box = document.getElementById(containerId);
  if(!box) return;
  if(!leaderboard.length){ box.innerHTML = ''; return; }
  const n = leaderboard.length;
  box.innerHTML = `
    <div class="export-box">
      <div class="export-title">Leaderboard code</div>
      <p class="export-help">Copy this code to add this device's ${n === 1 ? 'score' : `${n} scores`} to the master leaderboard. Pasting the same code more than once is safe.</p>
      <textarea class="export-code" readonly rows="3" spellcheck="false" aria-label="Leaderboard code">Creating code…</textarea>
      <div class="export-actions">
        <button class="btn ghost" type="button" disabled>Copy code</button>
        <span class="export-status" aria-live="polite"></span>
      </div>
    </div>`;
  const ta = box.querySelector('textarea');
  const btn = box.querySelector('button');
  const status = box.querySelector('.export-status');
  exportLeaderboardCode().then(code=>{
    ta.value = code;
    btn.disabled = false;
  }).catch(err=>{
    console.error('Could not create leaderboard code', err);
    ta.value = '';
    status.className = 'export-status err';
    status.textContent = 'This browser could not create a code.';
  });
  ta.addEventListener('focus', ()=> ta.select());
  btn.onclick = ()=> copyCode(ta, status);
}
async function copyCode(ta, status){
  let ok = false;
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(ta.value); ok = true; }
  }catch(e){ ok = false; }
  if(!ok){
    try{ ta.focus(); ta.select(); ok = document.execCommand('copy'); }catch(e){ ok = false; }
  }
  status.className = 'export-status ' + (ok ? 'ok' : 'err');
  status.textContent = ok ? '✓ Copied' : 'Copy blocked here. Select the code and copy it by hand.';
  if(ok) setTimeout(()=>{ if(status.textContent === '✓ Copied') status.textContent = ''; }, 4000);
}

function renderLeaderboardRows(entries, highlightId, limit = 10){
  const lbRow = (e,i)=>`
    <div class="lb-row ${highlightId && e.id===highlightId?'me':''}">
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name"><span class="lb-name-text">${escapeHtml(e.name)}</span>${e.label ? `<span class="lb-label" title="Laptop">${escapeHtml(e.label)}</span>` : ''}</span>
      <span class="lb-level lvl-${e.level}">${LEVELS[e.level].short}</span>
      ${e.incomplete
        ? `<span class="lb-time lb-inc" title="Incomplete: ${e.solved} of ${LEVELS[e.level].stages.length} stages solved">${e.solved}/${LEVELS[e.level].stages.length}</span>`
        : `<span class="lb-time">${fmtTime(e.timeMs)}</span>`}
      <span class="lb-score">${fmtPoints(e.total)}</span>
    </div>`;
  let rows = entries.slice(0, limit).map(lbRow).join('');
  const myIdx = highlightId ? entries.findIndex(e=>e.id===highlightId) : -1;
  if(myIdx >= limit) rows += `<div class="lb-gap">⋯</div>` + lbRow(entries[myIdx], myIdx);
  return `
    <div class="lb-row head"><span>#</span><span>Team</span><span>Level</span><span>Time</span><span>Score</span></div>
    ${rows || '<div class="lb-status">No scores yet. Be the first.</div>'}
    ${entries.slice(0, limit).some(e => e.incomplete) ? '<p class="lb-note" style="margin-top:6px;">A score shown with stages (for example 6/11) instead of a time is an incomplete run ended by a facilitator.</p>' : ''}
  `;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* ============ RENDER: DONE / FINAL SCORE ============ */
function renderDone(){
  const L = LEVELS[state.level];
  const list = activeStages();
  const elapsed = state.endTime - state.startTime;
  const hints = totalHints();
  const given = totalGiven();
  const inc = state.incomplete;
  const solved = solvedCount();
  const sc = inc ? computePartialScore(solved, hints, L.multiplier, given) : computeScore(elapsed, hints, L.multiplier, given);
  const minus = v => v ? '−' + fmtPoints(v) : '0';
  const lines = inc ? `
        <div class="score-line"><span>Time when ended</span><span>${fmtTime(elapsed)}</span></div>
        <div class="score-line"><span>Stages solved: ${solved} of ${list.length} × ${SCORING.perStageIncomplete}</span><span>${fmtPoints(sc.stagePoints)}</span></div>
        <div class="score-line minus"><span>Hints: ${hints} × ${SCORING.perHint}</span><span>${minus(sc.hintDeduction)}</span></div>
        ${given ? `<div class="score-line minus"><span>Answers given: ${given} × ${SCORING.perGiven}</span><span>${minus(sc.givenDeduction)}</span></div>` : ''}
        <div class="score-line sub"><span>Base points</span><span>${fmtPoints(sc.base)}</span></div>` : `
        <div class="score-line"><span>Time</span><span>${fmtTime(elapsed)}</span></div>
        <div class="score-line"><span>Starting points</span><span>${fmtPoints(sc.start)}</span></div>
        <div class="score-line minus"><span>Time: ${fmtPoints(sc.seconds)} seconds × ${SCORING.perSecond}</span><span>${minus(sc.timeDeduction)}</span></div>
        <div class="score-line minus"><span>Hints: ${hints} × ${SCORING.perHint}</span><span>${minus(sc.hintDeduction)}</span></div>
        ${given ? `<div class="score-line minus"><span>Answers given: ${given} × ${SCORING.perGiven}</span><span>${minus(sc.givenDeduction)}</span></div>` : ''}
        <div class="score-line sub"><span>Base points${sc.floorApplied ? ` (minimum of ${SCORING.floor} applied)` : ''}</span><span>${fmtPoints(sc.base)}</span></div>`;

  document.getElementById('panel').innerHTML = `
    <div class="center-icon">${inc ? '⏱️' : '🔓'}</div>
    <p class="stage-eyebrow">${inc ? 'Run Ended' : 'Mission Complete'}</p>
    <h2 class="stage-title">${inc ? "TIME'S UP" : 'ALL LOCKS CRACKED'}</h2>
    <p class="briefing">${inc
      ? `A facilitator ended this run. Your team solved ${solved} of ${list.length} stages. Great effort, and well done for everything you cracked.`
      : 'The school network is back online. Your team cracked every layer of encryption the intruder left behind.'}</p>

    <section class="score-card" aria-label="Final score">
      <div class="score-head">
        <span class="score-team">${escapeHtml(state.playerName)}${getDeviceLabel() ? ` <span class="lb-label" title="Laptop">${escapeHtml(getDeviceLabel())}</span>` : ''}</span>
        <span class="score-level lvl-${state.level}">${L.label}${inc ? ' · Incomplete' : ''}</span>
      </div>
      <div class="score-total"><span class="score-total-num">${fmtPoints(sc.total)}</span><span class="score-total-unit">points</span></div>
      <div class="score-lines">${lines}
        <div class="score-line"><span>${L.label} multiplier</span><span>${fmtMultiplier(sc.multiplier)}</span></div>
        <div class="score-line grand"><span>Total score</span><span>${fmtPoints(sc.total)}</span></div>
      </div>
      ${inc ? '<p class="lb-note" style="margin:8px 0 6px;">Incomplete runs are ranked below every team that finished.</p>' : ''}
    </section>

    <div class="leaderboard">
      <div class="leaderboard-title">Leaderboard</div>
      <div id="lbContent"></div>
      <p class="lb-note">${leaderboardNote()}</p>
      <div id="exportDone"></div>
      <button class="btn ghost" id="viewEventLbBtn" style="margin-top:12px;">View event leaderboard</button>
    </div>

    <details class="answers">
      <summary>Show decoded answers</summary>
      <div class="recap">
        ${list.map((s,i)=>`<div class="recap-row"><span>${i+1}. ${s.name}</span><span>${state.answers[i] ? state.answers[i] + (state.given[i] ? ' (given)' : '') : '—'}</span></div>`).join('')}
      </div>
    </details>

    <button class="btn start" id="playAgainBtn" style="margin-top:16px;">Run Mission Again</button>
  `;
  document.getElementById('playAgainBtn').onclick = resetState;
  document.getElementById('viewEventLbBtn').onclick = ()=> openLeaderboardDialog('event');

  const lbContent = document.getElementById('lbContent');
  if(!state.scoreSubmitted){
    lbContent.innerHTML = `
      <div class="lb-status" style="margin-bottom:10px;">Submit your score as <b style="color:var(--blue)">${escapeHtml(state.playerName)}</b>?</div>
      <button class="btn danger" id="submitScoreBtn">Submit to Leaderboard</button>
      <button class="btn ghost" id="skipScoreBtn" style="margin-left:8px;">Skip</button>
    `;
    document.getElementById('submitScoreBtn').onclick = ()=>{
      const ts = Date.now();
      const label = getDeviceLabel();
      const entry = submitScore({ id:makeEntryId(ts), name:state.playerName, level:state.level, timeMs:elapsed, hints, total:sc.total, ts,
        ...(label ? { label } : {}), ...(given ? { given } : {}), ...(inc ? { incomplete:true, solved } : {}) });
      state.scoreSubmitted = true;
      state.myEntryId = entry.id;
      clearRun();
      lbContent.innerHTML = renderLeaderboardRows(leaderboard, entry.id);
      renderExportBox('exportDone');
    };
    document.getElementById('skipScoreBtn').onclick = ()=>{
      state.scoreSubmitted = true;
      clearRun();
      syncFromSaved();
      lbContent.innerHTML = renderLeaderboardRows(leaderboard, null);
      renderExportBox('exportDone');
    };
  } else {
    syncFromSaved();
    lbContent.innerHTML = renderLeaderboardRows(leaderboard, state.myEntryId);
    renderExportBox('exportDone');
  }
}

function launchConfetti(){
  const colors = ['#00E5FF','#FF2145','#E7F6FF','#B45CFF'];
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:0;left:0;right:0;height:0;z-index:60;pointer-events:none;';
  document.body.appendChild(wrap);
  for(let i=0;i<50;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (1.6+Math.random()*1.2)+'s';
    c.style.animationDelay = (Math.random()*0.4)+'s';
    wrap.appendChild(c);
  }
  setTimeout(()=> wrap.remove(), 3200);
}

/* ============ TOOLKIT MODAL ============ */
// Every toolkit explains how to read it with a worked example. Examples never use a letter, code or
// coordinate that appears in the team's own ciphertext, so they teach the method without revealing anything.
// "guided" (Key Stages 3 and 4) adds worked examples for the multi-step methods; Ultimate gets the steps only.
function openToolkit(kind, keyword, extra){
  extra = extra || {};
  const content = document.getElementById('modalContent');
  const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const raw = String(extra.cipher || '');
  const guided = extra.guided !== false;
  const how = t => `<p class="tk-how"><b>How to read this:</b> ${t}</p>`;
  const example = t => `<p class="tk-example"><b>Example:</b> ${t}</p>`;
  const steps = list => `<ol class="tk-steps">${list.map(x => `<li>${x}</li>`).join('')}</ol>`;
  const sub = t => `<p class="tk-sub">${t}</p>`;
  const firstFree = (list, used) => list.find(x => !used(x));
  const lettersInCipher = new Set(raw.toUpperCase().replace(/[^A-Z]/g, ''));
  const groupsInCipher = new Set(raw.split(/\s+/).filter(Boolean));
  let html = '', wide = false;

  if(kind === 'atbashTable'){
    const mirror = c => String.fromCharCode(155 - c.charCodeAt(0));
    let rows = '<tr><th>Letter</th><th>Mirror</th><th>Letter</th><th>Mirror</th></tr>';
    for(let i = 0; i < 13; i++) rows += `<tr><td class="tk-key">${ABC[i]}</td><td class="tk-letter">${mirror(ABC[i])}</td><td class="tk-key">${ABC[i+13]}</td><td class="tk-letter">${mirror(ABC[i+13])}</td></tr>`;
    const ex = firstFree(ABC, c => lettersInCipher.has(c) || lettersInCipher.has(mirror(c)));
    html = `<h3>Mirror (Atbash) Table</h3>
      ${how('find each letter of your ciphertext in a <b>Letter</b> column. The letter next to it is its mirror, and that is the decoded letter. It works both ways.')}
      ${ex ? example(`${ex} is next to ${mirror(ex)}, so ${ex} decodes to ${mirror(ex)} (and ${mirror(ex)} decodes to ${ex}).`) : ''}
      <table>${rows}</table>`;

  } else if(kind === 'morseTable'){
    const L = Object.keys(MORSE);
    let rows = '<tr><th>Letter</th><th>Morse</th><th>Letter</th><th>Morse</th></tr>';
    for(let i = 0; i < 13; i++) rows += `<tr><td class="tk-key">${L[i]}</td><td class="tk-morse">${MORSE[L[i]]}</td><td class="tk-key">${L[i+13]}</td><td class="tk-morse">${MORSE[L[i+13]]}</td></tr>`;
    const ex = firstFree(L, l => groupsInCipher.has(MORSE[l]));
    html = `<h3>Morse Code Chart</h3>
      ${how('each group of dots and dashes in your message is one letter. Find the group in a <b>Morse</b> column; the letter to its left is the decoded letter.')}
      ${ex ? example(`${MORSE[ex]} is next to ${ex}, so ${MORSE[ex]} decodes to ${ex}.`) : ''}
      <table>${rows}</table>`;

  } else if(kind === 'binaryTable'){
    const bin = l => l.charCodeAt(0).toString(2).padStart(8, '0');
    let rows = '<tr><th>Binary</th><th>Decimal</th><th>Letter</th></tr>';
    for(const l of ABC) rows += `<tr><td>${bin(l)}</td><td>${l.charCodeAt(0)}</td><td class="tk-letter">${l}</td></tr>`;
    const ex = firstFree(ABC, l => groupsInCipher.has(bin(l)));
    html = `<h3>ASCII Binary Chart</h3>
      ${how('find each 8-digit group from your message in the <b>Binary</b> column, then read across to the <b>Letter</b> column. The list goes up in order: groups starting 0100 are A to O, groups starting 0101 are P to Z.')}
      ${ex ? example(`${bin(ex)} is on the row for ${ex} (decimal ${ex.charCodeAt(0)}), so it decodes to ${ex}.`) : ''}
      <table>${rows}</table>`;

  } else if(kind === 'keywordCipherTable'){
    const alpha = buildKeywordAlphabet(keyword);   // alpha[i] is the cipher letter for plain letter i
    const half = (from) => {
      const idx = [...Array(13).keys()].map(i => i + from);
      return `<table class="tk-kw">
        <tr><td class="tk-rowhead"><span class="tk-long">Cipher (what you see)</span><span class="tk-short">Cipher</span></td>${idx.map(i => `<td class="tk-key">${alpha[i]}</td>`).join('')}</tr>
        <tr><td class="tk-rowhead"><span class="tk-long">Plain (decoded)</span><span class="tk-short">Plain</span></td>${idx.map(i => `<td class="tk-letter">${ABC[i]}</td>`).join('')}</tr>
      </table>`;
    };
    const exI = firstFree([...Array(26).keys()], i => alpha[i] === ABC[i] || lettersInCipher.has(alpha[i]));
    html = `<h3>Keyword Cipher Alphabet (key: ${keyword})</h3>
      ${how('find each letter of your ciphertext in a <b>Cipher</b> row. The <b>Plain</b> letter directly below it is the decoded letter.')}
      ${exI !== undefined ? example(`the cipher letter ${alpha[exI]} has ${ABC[exI]} below it, so ${alpha[exI]} decodes to ${ABC[exI]}.`) : ''}
      ${half(0)}<div style="height:8px"></div>${half(13)}`;

  } else if(kind === 'columnarHelper'){
    const key = (keyword || '').toUpperCase().split('');
    const ranks = columnRanks(keyword);
    const len = extra.length || key.length;
    const perCol = Math.max(1, Math.ceil(len / key.length));
    let rows = '<tr><th class="tk-rowhead">Position</th>' + key.map((c,i) => `<th>${i+1}</th>`).join('') + '</tr>';
    rows += '<tr><td class="tk-rowhead">Keyword letter</td>' + key.map(c => `<td class="tk-letter">${c}</td>`).join('') + '</tr>';
    rows += '<tr><td class="tk-rowhead">Column number</td>' + ranks.map(r => `<td class="tk-count">${r}</td>`).join('') + '</tr>';
    const method = perCol === 1 ? steps([
        'Look at the <b>Column number</b> row below.',
        'Write the 1st letter of your ciphertext under column number 1, the 2nd letter under column number 2, and so on.',
        'Read the letters left to right in position order. That is the decoded word.'
      ]) : steps([
        `Your message has ${len} letters and the keyword has ${key.length}, so each column holds ${perCol} letters. Split the ciphertext into groups of ${perCol}.`,
        'Write group 1 down the column with number 1, group 2 down column number 2, and so on.',
        'Read the grid row by row, left to right.'
      ]);
    const worked = guided && perCol === 1 ? `${sub('Worked example (a different word)')}
      <table class="tk-mini">
        <tr><td class="tk-rowhead">Keyword letter</td><td>T</td><td>E</td><td>A</td><td>M</td></tr>
        <tr><td class="tk-rowhead">Column number</td><td class="tk-count">4</td><td class="tk-count">2</td><td class="tk-count">1</td><td class="tk-count">3</td></tr>
        <tr><td class="tk-rowhead">Letters</td><td class="tk-letter">C</td><td class="tk-letter">O</td><td class="tk-letter">D</td><td class="tk-letter">E</td></tr>
      </table>
      <p class="tk-how">The ciphertext DOEC: D goes under column number 1, O under 2, E under 3, C under 4. Reading left to right gives CODE.</p>` : '';
    html = `<h3>Columnar Transposition Key (key: ${keyword})</h3>${method}${worked}${sub('Your keyword')}<table>${rows}</table>`;

  } else if(kind === 'polybiusTable'){
    const grid = buildPolybiusGrid(keyword);
    let rows = '<tr><th>Row ↓ / Column →</th>' + [1,2,3,4,5].map(c => `<th>${c}</th>`).join('') + '</tr>';
    for(let r = 0; r < 5; r++){
      rows += `<tr><td class="tk-key">${r+1}</td>` + [0,1,2,3,4].map(c => `<td class="tk-letter">${grid[r*5+c]}</td>`).join('') + '</tr>';
    }
    const coords = ['23','32','24','42','34','43','25','52','35','53','14','41','45','54','13','31','12','21','15','51','22','33','44','55','11'];   // middle squares first: clearer examples
    const ex = firstFree(coords, rc => groupsInCipher.has(rc));
    html = `<h3>Polybius Square (key: ${keyword})</h3>
      ${how('each pair of numbers is <b>row, then column</b>. Go down to the row number, then across to the column number. I and J share a square.')}
      ${ex ? example(`${ex} means row ${ex[0]}, column ${ex[1]}, which is ${grid[(+ex[0]-1)*5 + (+ex[1]-1)]}.`) : ''}
      <table>${rows}</table>`;

  } else if(kind === 'vigenereTable'){
    wide = true;
    const keySet = new Set((keyword || '').toUpperCase().split(''));
    let rows = '<tr><th>Key ↓</th>' + ABC.map(c => `<th>${c}</th>`).join('') + '</tr>';
    for(let r = 0; r < 26; r++){
      const hl = guided && keySet.has(ABC[r]);
      rows += `<tr${hl ? ' class="tk-hl"' : ''}><td>${ABC[r]}</td>` + ABC.map((_, c) => `<td>${ABC[(r + c) % 26]}</td>`).join('') + '</tr>';
    }
    const kx = firstFree(ABC.slice(1), k => keySet.has(k));   // skip A: it doesn't shift, so it makes a poor example
    const cx = firstFree(ABC.slice().reverse(), c => lettersInCipher.has(c));
    const px = kx && cx ? ABC[(ABC.indexOf(cx) - ABC.indexOf(kx) + 26) % 26] : '';
    html = `<h3>Vigenère Square</h3>
      ${how('go down the <b>Key</b> column on the left to your keyword letter. Go along that row until you find your ciphertext letter. The letter at the top of that column is the decoded letter.')}
      ${px ? example(`key letter ${kx}, ciphertext letter ${cx}: along row ${kx} to ${cx}, then up to the top of that column, which is ${px}. So ${cx} decodes to ${px}.`) : ''}
      ${guided ? '<p class="tk-note">The rows for your keyword letters are highlighted.</p>' : ''}
      <div class="tk-scroll"><table>${rows}</table></div>`;

  } else if(kind === 'railFenceDiagram'){
    const rails = extra.rails, length = extra.length;
    const drawRails = (word, len, showLetters) => {
      const grid = railFenceDiagram(len, rails);
      let rowsHtml = '';
      for(let r = 0; r < rails; r++){
        const count = grid[r].filter(Boolean).length;
        rowsHtml += `<tr><td class="tk-rowhead">Rail ${r+1}</td>` +
          grid[r].map(v => `<td class="${v && showLetters ? 'tk-letter' : ''}">${v ? (showLetters ? word[v-1] : v) : ''}</td>`).join('') +
          `<td class="tk-count">${count} letter${count === 1 ? '' : 's'}</td></tr>`;
      }
      return { html:`<table>${rowsHtml}</table>`, grid };
    };
    const examples = { 2:'HELLO', 3:'PUZZLE', 4:'MYSTERY', 5:'DECODING' };
    const word = examples[rails];
    let worked = '';
    if(guided && word){
      const ex = drawRails(word, word.length, true);
      const groups = ex.grid.map(row => row.filter(Boolean).map(v => word[v-1]).join(''));
      worked = `${sub(`Worked example: ${word} on ${rails} rails`)}${ex.html}
        <p class="tk-how">Reading each rail left to right gives the ciphertext <b>${groups.join('')}</b>. To decode it, split it into groups of ${groups.map(g => g.length).join(', ')} (${groups.join(' | ')}), put each group back on its rail, then read the letters in zigzag order: ${word}.</p>`;
    }
    const yours = drawRails(null, length, false);
    html = `<h3>Rail Fence Zigzag (${rails} rails, ${length} letters)</h3>
      ${steps([
        'Count the letters on each rail of <b>your message</b> (the right-hand column below).',
        'Split your ciphertext into groups of those sizes: the first group is rail 1, the next is rail 2, and so on.',
        'Write each group along its rail, left to right, in the numbered spaces. Then read the letters in number order: 1, 2, 3...'
      ])}
      ${worked}
      ${sub('Your message: where each letter goes')}
      ${yours.html}
      <p class="tk-note">Each number is that letter's position in the original word.</p>`;

  } else if(kind === 'base64Table'){
    const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    let rows = '<tr><th>Char</th><th>Value</th><th>6-bit</th><th>Char</th><th>Value</th><th>6-bit</th></tr>';
    for(let i = 0; i < 32; i++){
      rows += `<tr><td class="tk-key">${B64[i]}</td><td>${i}</td><td>${i.toString(2).padStart(6,'0')}</td><td class="tk-key">${B64[i+32]}</td><td>${i+32}</td><td>${(i+32).toString(2).padStart(6,'0')}</td></tr>`;
    }
    const exChars = ['T','0','s'];
    const canShowExample = guided && !exChars.some(c => raw.includes(c));
    html = `<h3>Base64 Alphabet</h3>
      ${steps([
        'Look up each character of your message in a <b>Char</b> column to get its 6-bit value. Capital and small letters are different characters (S and s are not the same). Skip any = signs at the end.',
        'Write all the 6-bit values in one long line, in order.',
        'Split the line into groups of 8 bits, starting from the left. Throw away any bits left over at the end.',
        'Turn each group of 8 bits into a letter, just like the Binary Code stage (01000001 = A, 65).'
      ])}
      ${canShowExample ? example('T0s= → T is 010011, 0 is 110100, s is 101100 → 010011110100101100 → split into 01001111 (O) and 01001011 (K), with 2 spare bits thrown away → OK.') : ''}
      <div class="tk-scroll"><table>${rows}</table></div>`;
  }
  content.classList.toggle('wide', wide);
  content.innerHTML = html + `<button class="btn ghost modal-close" id="closeModal">Close</button>`;
  content.scrollTop = 0;
  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('closeModal').onclick = closeDialog;
}

/* ============ RESUME AN INTERRUPTED RUN ============ */
// The current run is saved as the team plays, so an accidental refresh or closed tab can be continued.
// The clock keeps running while the page is closed. Saved answers are re-checked before resuming.
const RUN_KEY = 'breachProtocol.currentRun.v1';
const RUN_MAX_AGE = 8 * 3600 * 1000;   // older unfinished runs are treated as abandoned

function saveRun(){
  if(!lbStore || !state.level || !state.startTime || state.screen === 'brief') return;
  if(state.screen === 'done' && state.scoreSubmitted){ clearRun(); return; }
  try{
    lbStore.setItem(RUN_KEY, JSON.stringify({
      v:1, level:state.level, playerName:state.playerName, answers:state.answers, hintsShown:state.hintsShown,
      screen:state.screen, startTime:state.startTime, endTime:state.endTime,
      given:state.given, incomplete:state.incomplete
    }));
  }catch(e){ console.error('Could not save the current run', e); }
}
function clearRun(){ if(lbStore){ try{ lbStore.removeItem(RUN_KEY); }catch(e){} } }

function readRun(){
  if(!lbStore) return null;
  let raw = null, r = null;
  try{ raw = lbStore.getItem(RUN_KEY); r = JSON.parse(raw || 'null'); }catch(e){ r = null; }
  const bad = ()=>{ if(raw !== null) clearRun(); return null; };
  if(!r || r.v !== 1 || !LEVELS[r.level]) return bad();
  const stages = LEVELS[r.level].stages, n = stages.length;
  if(typeof r.playerName !== 'string' || !r.playerName) return bad();
  if(!Array.isArray(r.answers) || r.answers.length !== n || !Array.isArray(r.hintsShown) || r.hintsShown.length !== n) return bad();
  if(r.given === undefined) r.given = Array(n).fill(false);   // runs saved before this field existed
  if(!Array.isArray(r.given) || r.given.length !== n || r.given.some(g => typeof g !== 'boolean')) return bad();
  if(r.given.some((g,i) => g && !r.answers[i])) return bad();
  r.incomplete = r.incomplete === true;
  if(r.incomplete && r.screen !== 'done') return bad();
  if(!Number.isFinite(r.startTime) || r.startTime > Date.now() + 60000) return bad();
  const done = r.screen === 'done';
  if(done){
    if(!Number.isFinite(r.endTime) || r.endTime < r.startTime) return bad();
  }else{
    if(!Number.isInteger(r.screen) || r.screen < 0 || r.screen >= n) return bad();
    if(Date.now() - r.startTime > RUN_MAX_AGE) return bad();
  }
  for(let i = 0; i < n; i++){
    if(!Number.isInteger(r.hintsShown[i]) || r.hintsShown[i] < 0 || r.hintsShown[i] > stageHintCount(stages[i])) return bad();
    if(r.answers[i] !== '' && typeof r.answers[i] !== 'string') return bad();
  }
  // every stage before the current one must be solved, and every saved answer must really be right
  const mustBeSolved = done ? (r.incomplete ? 0 : n) : r.screen;
  for(let i = 0; i < n; i++){
    if(i < mustBeSolved && !r.answers[i]) return bad();
    if(r.answers[i] && !answerOk(r.level, i, r.answers[i])) return bad();
  }
  return r;
}

function offerResume(){
  const r = readRun();
  if(!r) return;
  const L = LEVELS[r.level];
  const done = r.screen === 'done';
  const time = fmtTime((done ? r.endTime : Date.now()) - r.startTime);
  openDialog(`
    <h3>Continue the mission?</h3>
    <p class="dialog-text"><b>${escapeHtml(r.playerName)}</b> was playing ${L.label}, ${done
      ? (r.incomplete ? `and the run was ended early, but the score hasn't been submitted yet.` : `and finished in ${time}, but the score hasn't been submitted yet.`)
      : `on stage ${r.screen + 1} of ${L.stages.length}. The clock has kept running: ${time} so far.`}</p>
    <div class="dialog-actions">
      <button class="btn" id="resumeRunBtn">${done ? 'Go to the score' : 'Continue mission'}</button>
      <button class="btn ghost" id="discardRunBtn">Start a new mission</button>
    </div>`);
  document.getElementById('resumeRunBtn').onclick = ()=>{ closeDialog(); resumeRun(r); };
  document.getElementById('discardRunBtn').onclick = ()=>{ clearRun(); closeDialog(); };
  document.getElementById('resumeRunBtn').focus({ preventScroll:true });
}

function resumeRun(r){
  if(state.timerHandle) clearInterval(state.timerHandle);
  state.level = r.level;
  state.playerName = r.playerName;
  state.answers = r.answers.slice();
  state.hintsShown = r.hintsShown.slice();
  state.given = r.given.slice();
  state.incomplete = r.incomplete;
  state.startTime = r.startTime;
  state.endTime = r.screen === 'done' ? r.endTime : null;
  state.scoreSubmitted = false;
  state.screen = r.screen;
  state.timerHandle = r.screen === 'done' ? null : setInterval(updateHud, 500);
  updateHud();
  render();
}

// Warn before leaving mid-run (browsers show their own wording). The run is saved either way.
window.addEventListener('beforeunload', e=>{
  if(typeof state.screen === 'number'){ e.preventDefault(); e.returnValue = ''; }
});

/* ============ MAIN RENDER ============ */
function render(){
  renderTrace();
  if(state.screen === 'brief') renderBrief();
  else if(state.screen === 'done') renderDone();
  else renderStage(state.screen);
  saveRun();
}

document.getElementById('restartBtn').onclick = ()=>{

  const unsent = state.screen==='done' && !state.scoreSubmitted;

/* Leaderboard viewer: "Event" tab reads the published leaderboard.json, "This device" tab shows local scores. */
let lbTab = /^https?:$/.test(location.protocol) ? 'event' : 'device';
let lbFetchToken = 0;

function openLeaderboardDialog(tab){
  syncFromSaved();   // include scores saved from another tab
  if(tab === 'event' || tab === 'device') lbTab = tab;   // ignore click events passed in by onclick handlers
  openDialog(`
    <h3>Leaderboard</h3>
    <div class="lb-tabs" role="tablist" aria-label="Leaderboard">
      <button type="button" class="lb-tab" role="tab" id="tabEvent" data-tab="event">Event</button>
      <button type="button" class="lb-tab" role="tab" id="tabDevice" data-tab="device">This device</button>
    </div>
    <div id="lbTabBody" role="tabpanel"></div>
    <button class="btn ghost modal-close" id="closeLb">Close</button>`);
  document.querySelectorAll('.lb-tab').forEach(btn=>{
    btn.onclick = ()=>{ lbTab = btn.dataset.tab; renderLbTab(); };
  });
  document.getElementById('closeLb').onclick = closeDialog;
  renderLbTab();
  document.getElementById('closeLb').focus({ preventScroll:true });
}

function renderLbTab(){
  const body = document.getElementById('lbTabBody');
  if(!body) return;
  document.querySelectorAll('.lb-tab').forEach(btn=>{
    const on = btn.dataset.tab === lbTab;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-selected', on);
  });
  if(lbTab === 'device'){
    lbFetchToken++;   // ignore any event fetch still in flight
    const n = leaderboard.length;
    body.innerHTML = `
      <p class="lb-note" style="margin:0 0 10px;">${n ? `${n} ${n===1?'score':'scores'} saved on this device, ranked by total score.` : ''}</p>
      ${renderLeaderboardRows(leaderboard, null, Infinity)}
      <p class="lb-note">${leaderboardNote()}</p>
      <div id="exportDialog"></div>`;
    renderExportBox('exportDialog');
    return;
  }
  body.innerHTML = `<div class="lb-status">Loading the event leaderboard…</div>`;
  const token = ++lbFetchToken;
  fetchPublishedLeaderboard().then(r=>{
    if(token !== lbFetchToken || lbTab !== 'event' || !document.getElementById('lbTabBody')) return;
    body.innerHTML = publishedHtml(r);
    const again = document.getElementById('refreshPublished');
    if(again) again.onclick = renderLbTab;
  });
}

function publishedHtml(r){
  const refresh = `<div class="dialog-actions" style="margin-top:12px;"><button class="btn ghost" id="refreshPublished">Refresh</button></div>`;
  if(r.status === 'none'){
    return `<div class="lb-status">No event leaderboard has been published yet. Scores saved here are under <b>This device</b>.</div>${refresh}`;
  }
  if(r.status === 'invalid'){
    return `<div class="lb-status">The published leaderboard file couldn't be read. The event team should download a fresh file from the master device and upload it again.</div>${refresh}`;
  }
  if(r.status === 'error'){
    return `<div class="lb-status">The event leaderboard couldn't be loaded. Check the internet connection, or use <b>This device</b> to see scores saved here.</div>${refresh}`;
  }
  const n = r.entries.length;
  return `
    <p class="lb-note" style="margin:0 0 10px;">Updated ${fmtUpdated(r.updated)}${n ? `, ${n} ${n===1?'score':'scores'}` : ''}. The event team updates this during the day, so the newest games may not be on it yet.</p>
    ${n ? renderLeaderboardRows(r.entries, null, Infinity) : '<div class="lb-status">The event leaderboard is empty right now.</div>'}
    ${refresh}`;
}

/* ---------- facilitator controls for the run in progress ---------- */
function runSectionHtml(){
  if(typeof state.screen !== 'number' || !state.level) return '';
  const idx = state.screen, L = LEVELS[state.level], n = L.stages.length;
  const solved = solvedCount();
  const elapsed = fmtTime(Date.now() - state.startTime);
  const alreadySolved = !!state.answers[idx];
  return `
    <p class="dialog-label">This run</p>
    <p class="dialog-text"><b>${escapeHtml(state.playerName)}</b>, ${L.label}, on stage ${idx + 1} of ${n}, ${solved} solved, ${elapsed} on the clock.</p>

      <button class="btn" id="giveAnswerBtn" ${alreadySolved ? 'disabled' : ''}>${alreadySolved ? 'Stage already solved' : `Give answer for stage ${idx + 1}`}</button>
      <button class="btn danger" id="endRunBtn">End run now</button>
    </div>
    <p class="dialog-text small">Giving an answer costs the team ${SCORING.perGiven} points. Ending the run scores ${SCORING.perStageIncomplete} points per stage solved, and the team ranks below every team that finished.</p>
    <div class="fac-divider"></div>`;
}
function wireRunSection(){
  const give = document.getElementById('giveAnswerBtn');
  if(give) give.onclick = openGiveAnswerDialog;
  const end = document.getElementById('endRunBtn');
  if(end) end.onclick = openEndRunDialog;
}

function openGiveAnswerDialog(){
  if(typeof state.screen !== 'number') return;
  const idx = state.screen, s = activeStages()[idx], L = LEVELS[state.level];
  openDialog(`
    <h3>Give the answer for stage ${idx + 1}</h3>
    <p class="dialog-text">${L.label}, stage ${idx + 1}: ${escapeHtml(s.name)}. Type the answer from the facilitator answer sheet. The team will lose ${SCORING.perGiven} points and move on to the next stage.</p>
    <label class="dialog-label" for="giveAnswerInput">Answer</label>
    <input type="text" id="giveAnswerInput" class="dialog-input" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="feedback" id="giveFeedback" aria-live="polite"></div>
    <div class="dialog-actions">
      <button class="btn" id="confirmGive" disabled>Give answer</button>
      <button class="btn ghost" id="cancelGive">Back</button>
    </div>`);
  const input = document.getElementById('giveAnswerInput');
  const btn = document.getElementById('confirmGive');
  const fb = document.getElementById('giveFeedback');
  input.oninput = ()=>{ btn.disabled = !input.value.trim(); fb.textContent = ''; fb.className = 'feedback'; };
  input.onkeydown = e=>{ if(e.key === 'Enter' && !btn.disabled) btn.click(); };
  document.getElementById('cancelGive').onclick = openFacilitatorDialog;
  btn.onclick = ()=>{
    const guess = input.value.trim().toUpperCase();
    if(typeof state.screen !== 'number' || state.screen !== idx) { closeDialog(); return; }
    if(!answerOk(state.level, idx, guess)){
      fb.className = 'feedback err';
      fb.textContent = `That isn't the answer for ${L.label}, stage ${idx + 1}. Check the answer sheet.`;
      input.focus(); input.select();
      return;
    }
    state.answers[idx] = guess;
    state.given[idx] = true;
    closeDialog();
    if(idx === activeStages().length - 1) finishMission();
    else { state.screen = idx + 1; render(); }
  };
  input.focus();
}

function openEndRunDialog(){
  if(typeof state.screen !== 'number') return;
  const L = LEVELS[state.level], n = L.stages.length, solved = solvedCount();
  const sc = computePartialScore(solved, totalHints(), L.multiplier, totalGiven());
  openDialog(`
    <h3>End this run?</h3>
    <p class="dialog-text"><b>${escapeHtml(state.playerName)}</b> has solved ${solved} of ${n} stages. Ending now gives <b>${fmtPoints(sc.total)} points</b>: ${solved} × ${SCORING.perStageIncomplete}, minus hints${totalGiven() ? ' and given answers' : ''}, × ${L.multiplier}. The score is marked Incomplete and ranks below every team that finished. This can't be undone.</p>

    <label class="dialog-label" for="importCodeInput">Paste a leaderboard code from another device</label>
    <textarea id="importCodeInput" class="dialog-input import-input" rows="4" spellcheck="false" autocomplete="off" placeholder="BP1z..."></textarea>
    <div class="feedback" id="importFeedback" aria-live="polite"></div>
    <div class="dialog-actions">
      <button class="btn" id="importBtn" disabled>Import scores</button>
      <button class="btn ghost" id="closeFac">Close</button>
    </div>
    <div class="fac-divider"></div>
    <p class="dialog-label">Event leaderboard on GitHub</p>
    <p class="dialog-text small">Download this device's scores as <b>leaderboard.json</b>, then upload it to the GitHub repository to update the event leaderboard that everyone sees.</p>
    <div class="feedback" id="publishFeedback" aria-live="polite"></div>
    <div class="dialog-actions">
      <button class="btn" id="downloadPubBtn">Download leaderboard file</button>
      <button class="btn ghost" id="mergePubBtn">Merge in published scores</button>
    </div>
    <div class="fac-divider"></div>
    <div class="dialog-actions">
      <button class="btn danger" id="openClearBtn">Clear leaderboard</button>
    </div>`);
  const input = document.getElementById('importCodeInput');
  const btn = document.getElementById('importBtn');
  const feedback = document.getElementById('importFeedback');
  input.oninput = ()=>{ btn.disabled = !input.value.trim(); feedback.textContent = ''; feedback.className = 'feedback'; };
  document.getElementById('closeFac').onclick = closeDialog;
  document.getElementById('openClearBtn').onclick = openClearDialog;
  wireRunSection();
  const labelInput = document.getElementById('labelInput');
  const saveLabel = ()=>{
    const label = setDeviceLabel(labelInput.value);
    labelInput.value = label;
    const fb = document.getElementById('labelFeedback');
    fb.className = 'feedback ok';
    fb.textContent = label ? `✓ Saved. New scores from this laptop will show ${label}.` : '✓ Label removed.';
    const tag = document.getElementById('deviceTag');
    if(tag) tag.innerHTML = label ? `This laptop: <b>${escapeHtml(label)}</b>` : '';
  };
  document.getElementById('saveLabelBtn').onclick = saveLabel;
  labelInput.onkeydown = e=>{ if(e.key === 'Enter') saveLabel(); };
  document.getElementById('downloadPubBtn').onclick = ()=>{
    const count = downloadPublishedFile();
    showPublishInstructions(count);
  };
  const mergeBtn = document.getElementById('mergePubBtn');
  mergeBtn.onclick = async ()=>{
    const pubFeedback = document.getElementById('publishFeedback');
    mergeBtn.disabled = true;
    mergeBtn.textContent = 'Loading…';
    const r = await fetchPublishedLeaderboard();
    if(r.status !== 'ok'){
      pubFeedback.className = 'feedback err';
      pubFeedback.textContent = r.status === 'none'
        ? 'No event leaderboard has been published yet.'
        : r.status === 'invalid'
          ? "The published leaderboard.json couldn't be read. Upload a fresh file from the master device."
          : "The published leaderboard couldn't be loaded. Check the internet connection.";
      mergeBtn.textContent = 'Merge in published scores';
      mergeBtn.disabled = false;
      return;
    }
    const result = mergeRows(r.rows);
    refreshAfterBoardChange();
    showImportResult(result, 'Published scores merged');
  };
  btn.onclick = async ()=>{
    btn.disabled = true;
    btn.textContent = 'Importing…';
    try{
      const r = await importLeaderboardCode(input.value);
      refreshAfterBoardChange();
      showImportResult(r);
    }catch(err){
      console.error('Import failed', err);
      feedback.className = 'feedback err';
      feedback.textContent = CODE_ERROR_TEXT[err.kind] || CODE_ERROR_TEXT.damaged;
      btn.textContent = 'Import scores';
      btn.disabled = false;
    }
  };
}

function showPublishInstructions(count){
  openDialog(`
    <h3>Leaderboard file downloaded</h3>
    <p class="dialog-text">${count === 0
      ? '<span style="color:var(--red)">This file has no scores. Uploading it will empty the event leaderboard.</span>'
      : `The file contains ${count === 1 ? '1 score' : `${count} scores`}.`}</p>
    <ol class="dialog-steps">
      <li>In the GitHub repository, click <b>Add file</b>, then <b>Upload files</b>.</li>
      <li>Drag in <b>leaderboard.json</b> and click <b>Commit changes</b>.</li>
      <li>The event leaderboard updates in a minute or two.</li>
    </ol>
    <p class="dialog-text small">If your browser saved it as something like <b>leaderboard (1).json</b>, rename it to <b>leaderboard.json</b> before uploading, or the game won't find it.</p>
    <div class="dialog-actions">
      <button class="btn ghost" id="backToFac">Back to facilitator tools</button>
      <button class="btn ghost" id="closePub">Close</button>
    </div>`);
  document.getElementById('backToFac').onclick = openFacilitatorDialog;
  document.getElementById('closePub').onclick = closeDialog;
}

function showImportResult(r, title = 'Import complete'){
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const lines = [`<b style="color:var(--blue)">${r.added ? `Added ${plural(r.added, 'new score', 'new scores')}.` : 'No new scores to add.'}</b>`];
  if(r.skipped) lines.push(`Skipped ${plural(r.skipped, 'score that was', 'scores that were')} already on this board.`);
  if(r.cleared) lines.push(`Ignored ${plural(r.cleared, 'score', 'scores')} that had been cleared from this board earlier.`);
  if(r.rejected) lines.push(`<span style="color:var(--red)">Rejected ${plural(r.rejected, 'score that doesn\'t', 'scores that don\'t')} add up.</span>`);
  if(r.fromThisDevice) lines.push('This code came from this device, so there was nothing new to add.');
  openDialog(`
    <h3>${title}</h3>
    <p class="dialog-text">${lines.join('<br>')}</p>
    <div class="dialog-actions">
      <button class="btn" id="importAnother">Import another code</button>
      <button class="btn ghost" id="viewAfterImport">View leaderboard</button>
      <button class="btn ghost" id="closeImport">Close</button>
    </div>`);
  document.getElementById('importAnother').onclick = openFacilitatorDialog;
  document.getElementById('viewAfterImport').onclick = openLeaderboardDialog;
  document.getElementById('closeImport').onclick = closeDialog;
  document.getElementById('importAnother').focus({ preventScroll:true });
}

function openClearDialog(){
  syncFromSaved();
  const n = leaderboard.length;
  openDialog(`
    <h3>Clear the leaderboard</h3>
    <p class="dialog-text">${n === 0 ? 'There are no saved scores on this device right now.' : `This permanently deletes ${n === 1 ? 'the 1 saved score' : `all ${n} saved scores`} on this device. It can't be undone, and importing an older code won't bring them back.`}</p>
    <label class="dialog-label" for="clearConfirmInput">Type CLEAR to confirm</label>
    <input type="text" id="clearConfirmInput" class="dialog-input" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="dialog-actions">
      <button class="btn danger" id="confirmClear" disabled>Clear leaderboard</button>
      <button class="btn ghost" id="cancelClear">Cancel</button>
    </div>`);
  const input = document.getElementById('clearConfirmInput');
  const btn = document.getElementById('confirmClear');
  input.oninput = ()=>{ btn.disabled = input.value.trim().toUpperCase() !== 'CLEAR'; };
  input.onkeydown = e=>{ if(e.key==='Enter' && !btn.disabled) btn.click(); };
  document.getElementById('cancelClear').onclick = closeDialog;
  btn.onclick = ()=>{
    clearLeaderboard();
    state.myEntryId = null;
    refreshAfterBoardChange();
    openDialog(`
      <h3>Leaderboard cleared</h3>
      <p class="dialog-text">All saved scores have been deleted. The next team starts with an empty board.</p>
      <div class="dialog-actions"><button class="btn ghost" id="closeCleared">Close</button></div>`);
    document.getElementById('closeCleared').onclick = closeDialog;
  };
  input.focus();
}

updateHud();
render();
offerResume();
</script>
</body>
</html>
